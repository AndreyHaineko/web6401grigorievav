    <div class="container" id="data-menu-container">
        <h2>Feedbacks</h2>
        <table id="data-table">
            <thead id="gridplace">
                <tr>
                    <th class="one">Email</th>
                    <th class="two">Feedback</th>
                </tr>
            </thead>
            <tbody>
                <!-- Данные будут подгружаться динамически -->
            </tbody>
            <section class="feedback-section">
                <div class="feedback-container">
                    <h2 onclick="openModal()">Leave a feedback</h2>
                </div>
            </section>
    
            <!-- Модальное окно -->
            <div id="modal" class="modal">
                <div class="modal-content">
                    <span class="close" onclick="closeModal()">&times;</span>
                    <h2>Leave a feedback</h2>
                    <form id="reviewForm">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                        
                        <label for="review">Your feedback:</label>
                        <textarea id="review" name="review" required></textarea>
                        
                        <button type="submit">Send</button>
                    </form>
                </div>
            </div>
        </table>
    </div>
